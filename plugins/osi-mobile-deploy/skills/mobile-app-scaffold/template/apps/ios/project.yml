# xcodegen spec for MyApp
# Regenerate .xcodeproj with: xcodegen generate
#
# Stack policy (AI OSI URI osi-mobile-deploy 既定):
#   UI:              SwiftUI (@main App)
#   言語:            Swift 5.10+
#   最小サポート:    iOS 16.0
#   Firebase:        SPM + FirebaseCore.configure() を AppDelegate に guard 付きで
#   Flutter:         greenfield では選ばない (既存移行は flutter-swift-parity-port)
#
# Placeholder tokens (replaced by mobile-app-scaffold):
#   MyApp                → <APP_NAME>
#   com.example.myapp    → <BUNDLE_ID>
#   MY_APP_TEAM_ID       → <APPLE_TEAM_ID>
#   MY_APP_DISPLAY_NAME  → <DISPLAY_NAME>

name: MyApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    DEVELOPMENT_TEAM: MY_APP_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_DISPLAY_NAME: MY_APP_DISPLAY_NAME

configs:
  Debug: debug
  Release-Dev: release
  Release-Stg: release
  Release-Prod: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: MyApp/App
      - path: MyApp/Config
      - path: MyApp/Resources
        buildPhase: resources
        excludes:
          - "**/*.sample"
    info:
      path: MyApp/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        INFOPLIST_FILE: MyApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.debug
          APP_FLAVOR: dev
        Release-Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.dev
          APP_FLAVOR: dev
        Release-Stg:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.stg
          APP_FLAVOR: stg
        Release-Prod:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
          APP_FLAVOR: prod
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
