# iOS Release — auto-build + upload to TestFlight via fastlane on every push to main.
# All the gotchas hard-won during the initial osi-mobile-deploy build are baked in.
#
# Required GitHub Secrets (populated by mobile-secrets-sync + mobile-firebase-setup):
#   APPLE_TEAM_ID
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_B64          # base64 of the .p8 file
#   IOS_DIST_CERT_P12_B64                  # base64 of Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD                 # password for the .p12
#   IOS_KEYCHAIN_PASSWORD                  # temp-keychain password created here
#   GOOGLE_SERVICE_INFO_PLIST_DEV_B64      # base64 of GoogleService-Info-Dev.plist

name: iOS Release (auto → TestFlight)

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "fastlane/**"
      - ".github/workflows/ios-release-auto.yml"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor (dev/stg/prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, stg, prod]

concurrency:
  group: ios-release-${{ github.event.inputs.flavor || 'dev' }}
  cancel-in-progress: false

jobs:
  release:
    name: fastlane ios ios_beta_auto
    runs-on: macos-14
    timeout-minutes: 90
    env:
      # Xcode 26 (iOS 26 SDK) is required. macos-14 image ships it; if missing,
      # bump the runner label to macos-15.
      XCODE_VERSION: "26.0"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      APPLE_TEAM_ID:                       ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID:        ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_B64:       ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
      IOS_DIST_CERT_P12_B64:               ${{ secrets.IOS_DIST_CERT_P12_B64 }}
      IOS_DIST_CERT_PASSWORD:              ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_KEYCHAIN_PASSWORD:               ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      GOOGLE_SERVICE_INFO_PLIST_DEV_B64:   ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV_B64 }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── flavor → Configuration (bash 3.2 compatible case, not ${VAR^}) ────
      - name: Resolve flavor
        id: flavor
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'dev' }}"
          case "$FLAVOR" in
            dev)  FLAVOR_CAP="Dev"  ;;
            stg)  FLAVOR_CAP="Stg"  ;;
            prod) FLAVOR_CAP="Prod" ;;
            *)    echo "unknown flavor: $FLAVOR" >&2; exit 1 ;;
          esac
          echo "flavor=$FLAVOR"           >> "$GITHUB_OUTPUT"
          echo "flavor_cap=$FLAVOR_CAP"   >> "$GITHUB_OUTPUT"
          echo "configuration=Release-$FLAVOR_CAP" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Setup Ruby (bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install xcodegen
        run: brew install xcodegen

      # ── restore App Store Connect .p8 with the EXACT altool naming ───────
      - name: Restore App Store Connect .p8 (AuthKey_<ID>.p8 naming required)
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          # Also symlink into ~/private_keys so plain altool invocations find it
          mkdir -p "$HOME/private_keys"
          ln -sf "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
                 "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # ── restore Distribution certificate into a temp keychain ─────────────
      - name: Import Distribution certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the new keychain the default so xcodebuild can find the identity
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Restore GoogleService-Info.plist (dev)
        if: env.GOOGLE_SERVICE_INFO_PLIST_DEV_B64 != ''
        run: |
          mkdir -p apps/ios/MyApp/Resources
          echo "$GOOGLE_SERVICE_INFO_PLIST_DEV_B64" | base64 --decode \
            > apps/ios/MyApp/Resources/GoogleService-Info-Dev.plist
          # Copy to the generic name that AppDelegate looks for
          cp apps/ios/MyApp/Resources/GoogleService-Info-Dev.plist \
             apps/ios/MyApp/Resources/GoogleService-Info.plist

      - name: xcodegen generate
        working-directory: apps/ios
        run: xcodegen generate

      - name: Resolve Swift Packages
        working-directory: apps/ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MyApp.xcodeproj -scheme MyApp

      - name: Fastlane ios ios_beta_auto
        run: |
          bundle exec fastlane ios ios_beta_auto \
            flavor:"${{ steps.flavor.outputs.flavor }}" \
            notes:"CI build ${GITHUB_SHA:0:7}"

      # ── post-build hardening: ensure Assets.car + legacy AppIcon PNGs ─────
      - name: Materialize legacy AppIcon file names (iOS 26 validation guard)
        if: always()
        run: |
          set -euo pipefail
          IPA="$(ls apps/ios/build/ios/ipa/*.ipa 2>/dev/null | head -1 || true)"
          [ -z "$IPA" ] && { echo "no ipa (build failed?)"; exit 0; }
          TMP=$(mktemp -d)
          ditto -x -k "$IPA" "$TMP"
          APP=$(ls -d "$TMP"/Payload/*.app | head -1)
          # If Assets.car is missing, recompile from the source catalog
          if [ ! -f "$APP/Assets.car" ]; then
            echo "→ Assets.car missing; recompiling via actool"
            xcrun actool --compile "$APP" --platform iphoneos \
              --minimum-deployment-target 17.0 --app-icon AppIcon \
              --output-partial-info-plist "$TMP/AssetsInfo.plist" \
              apps/ios/MyApp/Resources/Assets.xcassets
          fi
          # Legacy PNGs for older validators
          SRC=apps/ios/MyApp/Resources/Assets.xcassets/AppIcon.appiconset
          [ -f "$SRC/AppIcon-120.png" ] && cp -f "$SRC/AppIcon-120.png" "$APP/AppIcon60x60@2x.png"
          [ -f "$SRC/AppIcon-180.png" ] && cp -f "$SRC/AppIcon-180.png" "$APP/AppIcon60x60@3x.png"
          # Re-pack with ditto so SwiftSupport symlinks survive (ITMS-90426 guard)
          rm -f "$IPA"
          ( cd "$TMP" && ditto -c -k --sequesterRsrc --keepParent Payload "$IPA" )
          echo "✓ Repacked $IPA"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
