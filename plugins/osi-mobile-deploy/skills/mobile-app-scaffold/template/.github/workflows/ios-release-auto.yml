# iOS Release — main に iOS の変更を push すると、署名して TestFlight に上げる（手でも動かせる）。
#
# 決まり（osi-mobile-deploy 0.9.0〜）:
#   * 最初から push で動く。後から「手動だけ」に変えない（配信を人のボタン待ちにしない）
#   * 鍵がまだ無いときは失敗にせず「鍵待ち」と出して終わる（鍵を後から入れる進め方でも、push のたびに赤が並ばない）
#   * 鍵は App Store Connect の 3 点だけ。署名は Xcode の自動署名（Apple のクラウド署名）に任せる。証明書（.p12）は要らない
#   * xcodebuild の出力を tail で絞るので、pipefail を必ず付ける（付けないと失敗が「成功」に見える）
#
# GitHub Secrets（名前は固定。コネクタの mobile_keys_to_github が「ツール設定」の会社の鍵から入れる）:
#   ASC_KEY_ID          App Store Connect API キーの ID（10 文字）
#   ASC_ISSUER_ID       Issuer ID（UUID）
#   ASC_PRIVATE_KEY     .p8 の中身そのまま（-----BEGIN PRIVATE KEY----- から）
#   GOOGLE_SERVICE_INFO_PLIST_DEV_B64   任意。Firebase を使うときだけ（mobile-firebase-setup が入れる）
# GitHub Variables（任意）:
#   BUILD_NUMBER_OFFSET  ビルド番号の下駄。既に TestFlight に大きい番号があるリポに後から入れたときだけ
#
# 鍵を入れたあと最初の 1 回は、コネクタの mobile_keys_to_github（start_release: true）か github_run_workflow で動かす。

name: iOS Release (auto → TestFlight)

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-release-auto.yml"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor (dev/stg/prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, stg, prod]

concurrency:
  group: ios-release-${{ github.event.inputs.flavor || 'dev' }}
  cancel-in-progress: false

jobs:
  release:
    name: Archive → TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: MyApp
      PROJECT: MyApp.xcodeproj

    steps:
      - uses: actions/checkout@v4

      # ── 鍵がそろっているか。無ければ「鍵待ち」で終わる（失敗にしない）─────────
      - name: Check keys
        id: keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          lack=""
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do [ -n "${!n}" ] || lack="$lack $n"; done
          if [ -n "$lack" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=鍵待ち::App Store Connect の鍵（${lack# }）がまだ GitHub にありません。TestFlight には上げずに終わります。コネクタの mobile_keys_to_github で入れてから、もう一度動かしてください"
            echo "### 鍵待ち：TestFlight には上げていません（足りない鍵:${lack}）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      # ── flavor → Configuration（bash 3.2 互換の case）──────────────────────
      - name: Resolve flavor
        id: flavor
        if: steps.keys.outputs.ready == 'true'
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'dev' }}"
          case "$FLAVOR" in
            dev)  CONF="Release-Dev"  ;;
            stg)  CONF="Release-Stg"  ;;
            prod) CONF="Release-Prod" ;;
            *)    echo "unknown flavor: $FLAVOR" >&2; exit 1 ;;
          esac
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "configuration=$CONF" >> "$GITHUB_OUTPUT"

      - name: Restore GoogleService-Info.plist (dev)
        if: steps.keys.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_INFO_PLIST_DEV_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV_B64 }}
        run: |
          [ -n "$GOOGLE_SERVICE_INFO_PLIST_DEV_B64" ] || { echo "Firebase の設定なし（使わないアプリなら問題なし）"; exit 0; }
          echo "$GOOGLE_SERVICE_INFO_PLIST_DEV_B64" | base64 --decode > apps/ios/MyApp/Resources/GoogleService-Info.plist

      # ── stale な .xcodeproj を使わない（xcodegen-project-regen 参照）────────
      - name: xcodegen generate
        if: steps.keys.outputs.ready == 'true'
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (signed by Apple cloud signing)
        if: steps.keys.outputs.ready == 'true'
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} + ${{ vars.BUILD_NUMBER_OFFSET || 0 }} ))
          echo "build number: $BUILD_NUMBER"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration "${{ steps.flavor.outputs.configuration }}" \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -80

      - name: Upload to TestFlight
        if: steps.keys.outputs.ready == 'true'
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          TEAM_ID=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings 2>/dev/null | awk -F' = ' '/ DEVELOPMENT_TEAM = /{print $2; exit}')
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "### TestFlight に上げました（${{ steps.flavor.outputs.flavor }} / build $(( ${{ github.run_number }} + ${{ vars.BUILD_NUMBER_OFFSET || 0 }} ))）。Apple の処理に 10〜30 分かかります" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
