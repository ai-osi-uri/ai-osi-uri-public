# Android Release — auto-build AAB + upload to Play Internal Track on every push to main.
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_B64                  # base64 of release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON      # raw JSON string (multi-line)
#   GOOGLE_SERVICES_JSON_DEV_B64          # base64 of Firebase google-services.json (dev)

name: Android Release (auto → Play Internal Track)

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "fastlane/**"
      - ".github/workflows/android-release-auto.yml"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor (dev/stg/prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, stg, prod]

concurrency:
  group: android-release-${{ github.event.inputs.flavor || 'dev' }}
  cancel-in-progress: false

jobs:
  release:
    name: fastlane android android_beta_auto
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve flavor
        id: flavor
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'dev' }}"
          case "$FLAVOR" in
            dev|stg|prod) : ;;
            *) echo "unknown flavor: $FLAVOR" >&2; exit 1 ;;
          esac
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Ruby (bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_B64:      ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          cat > apps/android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Restore google-services.json (dev flavor)
        env:
          GOOGLE_SERVICES_JSON_DEV_B64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_B64 }}
        if: env.GOOGLE_SERVICES_JSON_DEV_B64 != ''
        run: |
          mkdir -p apps/android/app/src/dev
          echo "$GOOGLE_SERVICES_JSON_DEV_B64" | base64 --decode \
            > apps/android/app/src/dev/google-services.json
          # Also place at app root for flavors that don't override
          cp apps/android/app/src/dev/google-services.json apps/android/app/google-services.json

      - name: Restore Play SA JSON
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "GOOGLE_PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Gradle bundleRelease
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundle${{ steps.flavor.outputs.flavor }}Release --no-daemon

      - name: Fastlane android android_beta_auto
        run: |
          bundle exec fastlane android android_beta_auto \
            flavor:"${{ steps.flavor.outputs.flavor }}"
