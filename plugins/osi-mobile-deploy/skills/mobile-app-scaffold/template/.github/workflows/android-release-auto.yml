# Android Release — main に Android の変更を push すると、AAB を作って Google Play の内部テストに上げる（手でも動かせる）。
#
# 決まり（osi-mobile-deploy 0.9.0〜）:
#   * 最初から push で動く。後から「手動だけ」に変えない
#   * 鍵がまだ無いときは失敗にせず「鍵待ち」と出して終わる
#
# GitHub Secrets:
#   ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#                                         # mobile_generate_keystore で作って入れる（失うと更新できないので Drive にも控える）
#   PLAY_SERVICE_ACCOUNT_JSON             # Play のサービスアカウント JSON そのまま。コネクタの mobile_keys_to_github が会社の鍵から入れる
#   GOOGLE_SERVICES_JSON_DEV_B64          # 任意。Firebase を使うときだけ
#
# 鍵を入れたあと最初の 1 回は、mobile_keys_to_github（start_release: true）か github_run_workflow で動かす。
# Play は最初の 1 本だけ Play Console から手で上げる決まり（API では新しいアプリに上げられない）。

name: Android Release (auto → Play Internal Track)

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "fastlane/**"
      - ".github/workflows/android-release-auto.yml"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor (dev/stg/prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, stg, prod]

concurrency:
  group: android-release-${{ github.event.inputs.flavor || 'dev' }}
  cancel-in-progress: false

jobs:
  release:
    name: fastlane android android_beta_auto
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 鍵がそろっているか。無ければ「鍵待ち」で終わる（失敗にしない）─────────
      - name: Check keys
        id: keys
        env:
          ANDROID_KEYSTORE_B64:      ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          lack=""
          for n in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do [ -n "${!n}" ] || lack="$lack $n"; done
          if [ -n "$lack" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=鍵待ち::Google Play に上げる鍵（${lack# }）がまだ GitHub にありません。Play には上げずに終わります"
            echo "### 鍵待ち：Google Play には上げていません（足りない鍵:${lack}）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve flavor
        id: flavor
        if: steps.keys.outputs.ready == 'true'
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'dev' }}"
          case "$FLAVOR" in
            dev|stg|prod) : ;;
            *) echo "unknown flavor: $FLAVOR" >&2; exit 1 ;;
          esac
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Ruby (bundler cache)
        if: steps.keys.outputs.ready == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Restore release keystore
        if: steps.keys.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_B64:      ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          cat > apps/android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Restore google-services.json (dev flavor)
        env:
          GOOGLE_SERVICES_JSON_DEV_B64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_B64 }}
        if: steps.keys.outputs.ready == 'true'
        run: |
          [ -n "$GOOGLE_SERVICES_JSON_DEV_B64" ] || { echo "Firebase の設定なし（使わないアプリなら問題なし）"; exit 0; }
          mkdir -p apps/android/app/src/dev
          echo "$GOOGLE_SERVICES_JSON_DEV_B64" | base64 --decode \
            > apps/android/app/src/dev/google-services.json
          # Also place at app root for flavors that don't override
          cp apps/android/app/src/dev/google-services.json apps/android/app/google-services.json

      - name: Restore Play SA JSON
        if: steps.keys.outputs.ready == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "GOOGLE_PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Gradle bundleRelease
        if: steps.keys.outputs.ready == 'true'
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundle${{ steps.flavor.outputs.flavor }}Release --no-daemon

      - name: Fastlane android android_beta_auto
        if: steps.keys.outputs.ready == 'true'
        run: |
          bundle exec fastlane android android_beta_auto \
            flavor:"${{ steps.flavor.outputs.flavor }}"
