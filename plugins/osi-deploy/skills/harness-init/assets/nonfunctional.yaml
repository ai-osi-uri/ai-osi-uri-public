# nonfunctional.yaml — このアプリの非機能要件（案件ごとの値）
#
# 不変条件（すべての案件に共通。値ではなく「あるべき状態」）:
#   1. 事象の種類ごとに許容できる被害が決まっていて、それに収める復旧手段が実在し、
#      一度は実際に戻して確かめてある。
#   2. 想定する負荷が決まっていて、その負荷で業務に耐えることを確かめてある。
#      超えたときの挙動が決まっている。
#   3. 異常は人に届き、届いたあと原因を辿れる記録が、消えも書き換えられもしない形で残る。
#   4. 入ってよい者だけが入れ、データは見てよい者以外には読めない。
#      本番のデータは本番の外に出さない。
#   5. 変更を本番に入れる手順と戻す手順が決まっていて、戻す方は試してある。
#   6. 利用できる環境の範囲・使う人の準備・今あるものからの引き継ぎは、
#      案件ごとに要否を決めて記録する。
#   7. 「決めていない」を既定値にしない。AIやプラットフォームが黙って選んだ値は、
#      決定として記録するか、人に問う。
#
# 書き方:
#   - 各項目の `decided` に、この案件で決めたことを書く。何をどの粒度で決めるかは
#     アプリの仕様から自分で洗い出す（ここに項目名の一覧は置かない）。
#   - `verified` には、それが成り立つことをどう確かめたかを書く。まだなら `null`。
#   - 空欄・`【TODO】` は「決めていない」＝ deploy-preflight で FAIL。
#     `verified: null` は WARN（初回公開前は未検証でよいが、公開後に埋める）。
#   - 「不要」「許容する」も決定なので、そう書けば PASS。

recovery:            # 1
  decided: 【TODO】
  verified: null     # 実際に戻した日と方法

load:                # 2
  decided: 【TODO】
  verified: null

observability:       # 3
  decided: 【TODO】
  verified: null

access:              # 4
  decided: 【TODO】
  verified: null

change:              # 5
  decided: 【TODO】
  verified: null     # 戻す手順を試した日

outside:             # 6（不要なら「不要」と書く）
  decided: 【TODO】
  verified: null

accepted_defaults:   # 7 プラットフォームやAIが黙って選んだ値のうち、決定として受け入れたもの
  - 【TODO】
