# OSI Finance 発火eval データセット（単一情報源）
#
# QA-リリースチェックリスト.md の「C. スキル発火テスト」を機械可読化したもの。
# 各スキルが「発火すべき」入力で起動し、「発火すべきでない」入力で起動しない（＝別スキルが正解）
# ことを検証するためのデータセット。runner: ../../../../scripts/eval_skill_firing.py
#
# 形式:
#   skills:
#     <skill-name>:
#       fire:        # このスキルが発火すべきフレーズ（>=2）
#         - "..."
#       no_fire:     # このスキルは発火すべきでない（target が本来の発火先・>=1）
#         - { phrase: "...", target: <別スキル名> }
#
# 編集ルール: フレーズは各 SKILL.md の description のトリガー語に忠実に。
# target は必ず実在するスキル名・かつ自分自身以外。runner --strict で整合性を検証する。
plugin: osi-finance

skills:
  osi-finance-contract-intake:
    fire:
      - "契約を取り込んで"
      - "新しい契約を請求スケジュールに反映"
      - "サンプル社の契約を台帳に"
      - "契約書フォルダを整理して請求予定を作って"
      - "契約起点で請求準備をして"
    no_fire:
      - { phrase: "今月の請求書を作って", target: osi-finance-invoice }
      - { phrase: "この請求書払って", target: osi-finance-payment-intake }

  osi-finance-invoice:
    fire:
      - "今月の請求書を作って"
      - "サンプル社の請求書を発行"
      - "請求下書きを作成"
      - "月初の請求書ドラフトを出して"
      - "請求書PDFを生成してメール下書きにして"
    no_fire:
      - { phrase: "契約を取り込んで", target: osi-finance-contract-intake }
      - { phrase: "受け取った請求書を支払管理台帳に入れて", target: osi-finance-payment-intake }

  osi-finance-payment-intake:
    fire:
      - "この請求書払って"
      - "サンプル社の請求書を支払予定に"
      - "受領請求書を台帳に起票"
      - "振込で払う請求書を起票して"
      - "受け取った請求書を支払管理台帳に入れて"
    no_fire:
      - { phrase: "今月の請求書を作って", target: osi-finance-invoice }
      - { phrase: "受領請求書の取りこぼしを検出", target: osi-finance-payment-detect }

  osi-finance-payment-detect:
    fire:
      - "受領請求書の取りこぼしを検出"
      - "新着請求書を支払予定に"
      - "未起票の請求書がないか確認"
      - "払い漏れチェックして"
      - "今朝届いた請求書を確認"
    no_fire:
      - { phrase: "この請求書払って", target: osi-finance-payment-intake }
      - { phrase: "今月の請求書を作って", target: osi-finance-invoice }

  osi-finance-mf-sync:
    fire:
      - "台帳とMFを突合して"
      - "計上漏れを確認"
      - "会計連携の状況をチェック"
      - "未計上の支払いを探して"
      - "支払済がMFに入っているか確認"
    no_fire:
      - { phrase: "受領請求書を台帳に起票", target: osi-finance-payment-intake }
      - { phrase: "今月の経理を締めて", target: osi-finance-monthly }

  osi-finance-ar-sync:
    fire:
      - "請求をMFに計上"
      - "売上を会計連携"
      - "売掛金を計上"
      - "入金消込をMFに"
      - "請求台帳とMFを売上で突合"
    no_fire:
      - { phrase: "支払済がMFに入っているか確認", target: osi-finance-mf-sync }
      - { phrase: "今月の請求書を作って", target: osi-finance-invoice }

  osi-finance-monthly:
    fire:
      - "今月の経理を締めて"
      - "月次クローズ"
      - "月次の会計処理をして"
      - "先月分の仕訳をレビュー"
      - "未払金を検算して"
    no_fire:
      - { phrase: "今月の請求書を作って", target: osi-finance-invoice }
      - { phrase: "この請求書払って", target: osi-finance-payment-intake }

  osi-finance-dashboard:
    fire:
      - "会計ダッシュボードを作って"
      - "今月の請求状況・支払状況・経費状況を一覧で見たい"
      - "経理のダッシュボードを出して"
      - "請求と支払と経費をまとめて管理したい"
      - "損益と費用の内訳を見せて"
    no_fire:
      - { phrase: "今月の請求書を作って", target: osi-finance-invoice }
      - { phrase: "この請求書払って", target: osi-finance-payment-intake }

  osi-finance-setup:
    fire:
      - "OSI Finance を導入して"
      - "経理を初期セットアップして"
      - "OSI Finance をセットアップ"
      - "請求支払台帳を立ち上げて"
      - "osi-finance-settings を作りたい"
    no_fire:
      - { phrase: "今月の請求書を作って", target: osi-finance-invoice }
      - { phrase: "契約を取り込んで", target: osi-finance-contract-intake }
