# OSI Finance 台帳データレイアウト
#
# layout_version 5 — 2026-08-11。実台帳（06.会計 配下の xlsx）から起こした。
# v4 までは仕様先行で書かれており、実台帳と乖離していた（経費一覧の列名、月次支払管理の
# 列構成、請求ステータスの語彙など）。v5 は実データを正とする。
#
# 読み書きの原則
#   * 列は必ずヘッダー名で解決する。列番号を決め打ちしない。
#   * ヘッダー行は1行目とは限らない（header_row を参照）。検出は server/header.js に集約。
#   * enum は「読むときは許容表記も受ける／書くときは正規形」で扱う。
#   * 実データが0行のタブは枠だけ用意されている状態。列は信用してよい。
#   * 書き込み開始行を「header_row + データ件数 + 1」で計算してはいけない。台帳の途中に空行が
#     あるため既存行を上書きする（実際に11行を潰して復旧した事故がある）。sheets_append_row を
#     使うか、末尾から遡って最初の非空行を取り、その次行に書く。data_rows_at_survey は
#     件数の目安であって行位置ではない。
#   * 読み取り範囲はタブ名だけを渡す。`!A1:T600` のような範囲指定は列・行が増えたとき静かに欠ける。
#   * 台帳を書き換える前にファイルのバックアップを取る。

layout_version: 6  # 2026-08-14: 支払管理台帳「経費一覧」に 発生日 列を新設（D列）。UPSIDER明細614行を投入
surveyed_at: 2026-08-14
source: 実台帳（Google スプレッドシートから xlsx へ完全同期したもの）

ledgers:
  請求管理台帳:
    tabs:
      発行者設定:
        header_row: 1
        data_rows_at_survey: 13
        key: "項目"
        note: "key-value 形式。行が固定で列は 項目/値/備考。"
        columns:
          - name: "項目"
          - name: "値"
          - name: "備考"
            observed: ["備考欄に明記", "対象月＋月内連番。台帳で一元採番", "標準税率", "請求日=対象月翌月1日／支払期限=翌月末", "請求書ヘッダー", "適格請求書発行事業者番号"]  # 実データの分布（規定値ではない）

      契約マスタ:
        header_row: 1
        data_rows_at_survey: 30
        key: "契約ID"
        note: "状態が唯一の状態列（ドラフト/送付済/締結済/解約）。有効・終了は契約終了日から導出するので列に持たない。\n  かつて ステータス(有効/終了) 列があったが、手管理で43件中8件が実態とズレていたため 2026-08-16 に廃止した。"
        columns:
          - name: "契約ID"
          - name: "取引先"
          - name: "正式名称"
          - name: "郵便番号"
            observed: ["105-0023", "141-0032", "150-0002", "150-0044", "153-0043", "541-0048", "693-0057", "812-0025"]  # 実データの分布（規定値ではない）
          - name: "住所"
          - name: "請求先To"
          - name: "Toアドレス"
          - name: "CC"
            observed: ["中根篤史", "小村淳浩、野本卓弘、今岡明信", "小田悠子", "岸田 果純", "庄司愛美", "松岡 清一", "西谷明久"]  # 実データの分布（規定値ではない）
          - name: "CCアドレス"
          - name: "契約種別"
            observed: ["業務委託", "業務委託(アドバイザリー)", "業務委託(原契約)", "業務委託(準委任)", "業務委託(請負)"]  # 実データの分布（規定値ではない）
          - name: "契約内容"
          - name: "金額区分"
            values: ["月額固定", "一括"]
          - name: "月額(税込)"
          - name: "一括額(税込)"
            observed: ["1716000", "220000", "2750000", "3300000", "4400000", "825000", "990000"]  # 実データの分布（規定値ではない）
          - name: "税率"
            observed: ["10%"]  # 実データの分布（規定値ではない）
          - name: "契約開始"
          - name: "契約終了"
          - name: "支払サイト"
          - name: "契約書ファイル"
            note: "空でよい。契約書が無い場合は 出所=実績から とセットで使う。"
          - name: "ステータス"
            values: ["有効", "終了"]
            note: "期間終了は契約終了日から導出してもよいが、実台帳はこの列で管理している。"
          - name: "旧ID"
          - name: "備考"
          - name: "取引先ID"
          - name: "方向"
            values: ["受注", "発注"]
          - name: "状態"
            values: ["ドラフト", "送付済", "締結済"]
            note: "実データは締結済のみ。スケジュール展開は締結済の行だけ。"
          - name: "出所"
            values: ["手動", "Gmail取込", "実績から"]
            note: "「実績から」= 契約書が手元に無く、支払実績や会計の仕訳から遡って起票したもの。契約書ファイルが空でも、なぜ空なのかがこの列で分かる。空欄のまま放置すると「登録し忘れ」と区別できない。"

          - name: "雛形ID"
          - name: "envelope_id"
            observed: ["137591ca", "1480e794", "27af26c4", "603fec75", "97ec9ed9", "b390001d"]  # 実データの分布（規定値ではない）
          - name: "作成者"
          - name: "作成日時"
          - name: "更新者"
          - name: "更新日時"

      雛形マスタ:
        header_row: 1
        data_rows_at_survey: 18
        key: "雛形ID"
        note: "契約書の雛形。2026-08-12 に xlsx 化を機に タブ名を シート1 から 雛形マスタ へ改名した（スプレッドシート時代の名残）。"
        columns:
          - name: "雛形ID"
            observed: ["TPL-001"]  # 実データの分布（規定値ではない）
          - name: "雛形名"
          - name: "区分"
            values: ["受注用", "発注用", "共通"]
          - name: "用途メモ"
          - name: "ファイルパス"
          - name: "登録日"
            observed: ["2026-08-10"]  # 実データの分布（規定値ではない）
          - name: "登録元"
            values: ["AI生成", "実契約からの雛形化"]
          - name: "使用回数"
            observed: ["0"]  # 実データの分布（規定値ではない）
          - name: "登録者"
          - name: "更新者"
          - name: "更新日時"

      月次請求スケジュール:
        header_row: 1
        data_rows_at_survey: 106
        key: "契約ID + 対象月"
        note: "請求の予定と実績。1行=1請求。"
        columns:
          - name: "契約ID"
          - name: "取引先"
          - name: "対象月"
          - name: "件名"
          - name: "請求額(税込)"
          - name: "請求書番号"
            note: >
              1請求書=1行とは限らない。合算請求（複数明細を1通で発行）のとき、同じ番号が複数行に付く。
              重複=異常と判定してはいけない。例: INV-2026-07-016 は NITOH の CAIO と準備金2件を1通にまとめたもの。
              ただし合算グループは対象月をまたぐことがある（上の例は 2026-06 の行と 2026-07 の行が同じ番号）。
              グルーピングは請求書ID、計上の按分は対象月。グループ全体を1つの対象月に寄せると、
              翌月の実行が残りの行を拾って二重計上する（実際に 3,575,000 を売上・入金とも二重計上した）。
              行数では重複判定せず、同一請求書IDの計上累計が額面を超えないかで検算する。
          - name: "請求日"
          - name: "支払期限"
          - name: "請求ステータス"
            values: ["未請求", "下書き済", "請求済", "入金済", "対象外", "要確認(過去・番号なし)"]
            accept:
              "下書き作成済": "下書き済"
            order: "未請求 → 下書き済 → 請求済 → 入金済"
            note: "対象外・要確認 は進行順の外。差し戻し（→未請求）は人の操作のみ。スキルは status を下げない。"
          - name: "送付請求書ファイル"
          - name: "入金日"
            observed: ["2026-04-20", "2026-04-30", "2026-05-28", "2026-05-29", "2026-06-01", "2026-06-03", "2026-07-22"]  # 実データの分布（規定値ではない）
          - name: "入金額"
          - name: "旧ID"
          - name: "備考"
          - name: "突合結果"
          - name: "突合日時"
          - name: "作成者"
          - name: "作成日時"
          - name: "更新者"
          - name: "更新日時"

  支払管理台帳:
    tabs:
      支払先マスタ:
        header_row: 3
        data_rows_at_survey: 23
        key: "支払先ID"
        note: "ヘッダーは3行目（1行目が空、2行目が凡例）。"
        columns:
          - name: "支払先ID"
          - name: "支払先名"
          - name: "支払先区分"
            values: ["法人", "個人", "個人事業主", "要確認"]
          - name: "支払カテゴリ"
            observed: ["その他", "外注費", "経費", "要確認"]  # 実データの分布（規定値ではない）
          - name: "主担当者名"
            observed: ["中井秀行", "井上奈々", "大澤脩輔", "大雲 拓生", "安藤 貴史", "小村淳浩", "洪辰圭", "諫山圭司"]  # 実データの分布（規定値ではない）
          - name: "メールアドレス"
          - name: "振込先銀行"
          - name: "振込先支店"
          - name: "口座種別"
            observed: ["―", "普通", "要確認"]  # 実データの分布（規定値ではない）
          - name: "口座番号"
          - name: "口座名義"
          - name: "契約開始日"
            observed: ["2026/06/24", "2026/07/01"]  # 実データの分布（規定値ではない）
          - name: "契約終了日"
          - name: "契約タイプ"
            values: ["月額固定", "都度"]
          - name: "月額固定（税抜）"
            observed: ["30000", "50000"]  # 実データの分布（規定値ではない）
          - name: "時間単価（税抜）"
          - name: "消費税率"
            values: ["10.0%", "0.0%", "非課税", "対象外（不課税）"]
            note: "実データは 0 / 0.0% / 10.0% / 非課税 / 対象外（不課税） / 要確認 が混在。書くときは正規形に寄せる。"
          - name: "源泉徴収対象"
            observed: ["あり", "なし", "要確認", "要確認（士業報酬なら源泉対象）"]  # 実データの分布（規定値ではない）
          - name: "源泉徴収税率"
            observed: ["10.2%"]  # 実データの分布（規定値ではない）
          - name: "支払サイクル"
            observed: ["月末締め翌月末払い", "月次", "毎月末日引落", "都度"]  # 実データの分布（規定値ではない）
          - name: "取引先ID"
            observed: ["072", "901", "902", "903"]  # 実データの分布（規定値ではない）
          - name: "ステータス"
            values: ["支払対象", "要確認"]
          - name: "作成者"
          - name: "作成日時"
          - name: "更新者"
          - name: "更新日時"
          - name: "既定の支払方法"
            values: ["振込", "カード", "口座振替", "現金", "カード発行会社"]
            note: "その支払先を普段どう払うか。payment-intake / payment-detect が振込とカードを振り分けるのに使う。カード払いは支払予定に起票せず証憑保存のみ。UPSIDER のようなカードの請求元は支払先ではないので「カード発行会社」で区別する。"

      月次支払管理:
        header_row: 4
        data_rows_at_survey: 104
        key: "支払先ID + 対象月"
        note: "支払の実績。ヘッダーは4行目。mf-sync が支払額・差額・支払ステータス・遅延日数を書き戻す。"
        columns:
          - name: "支払先ID"
          - name: "支払先名"
          - name: "支払カテゴリ"
            values: ["外注費", "経費", "その他"]
          - name: "対象月"
            observed: ["2026/03", "2026/04", "2026/05", "2026/06", "2026/07", "2026/08"]  # 実データの分布（規定値ではない）
          - name: "契約タイプ"
            observed: ["月額固定", "都度"]  # 実データの分布（規定値ではない）
          - name: "月額固定（税抜）"
            observed: ["50000", "770000"]  # 実データの分布（規定値ではない）
          - name: "稼働時間"
            observed: ["148.5"]  # 実データの分布（規定値ではない）
          - name: "時間単価額（税抜）"
            observed: ["0"]  # 実データの分布（規定値ではない）
          - name: "実費・その他（税抜）"
          - name: "支払金額（税抜）"
          - name: "消費税額"
          - name: "源泉徴収税額"
            observed: ["0"]  # 実データの分布（規定値ではない）
          - name: "支払金額（税込）"
          - name: "請求書番号"
          - name: "請求書受領日"
          - name: "支払予定日"
          - name: "支払日"
          - name: "支払額"
          - name: "差額"
            observed: ["0", "1"]  # 実データの分布（規定値ではない）
          - name: "支払ステータス"
            values: ["未払い", "支払済"]
            accept:
              "未払予定": "未払い"
            order: "未払い → 支払済"
            note: "支払済への自動更新は mf-sync が銀行明細で裏取りできた行のみ。送金はしない。"
          - name: "遅延日数"
          - name: "承認者"
          - name: "備考"
          - name: "作成者"
          - name: "作成日時"
          - name: "更新者"
          - name: "更新日時"
          - name: "支払方法"
            values: ["振込", "カード", "口座振替", "現金"]
            note: "2026-08-13 追加。実績表にはカード払いも載せる（費用の記録として）が、支払予定（月次支払スケジュール）には振込だけを載せる。予定表にカードが混ざると、自動で落ちるものを人が二重に振り込む事故につながる。"

      経費一覧:
        header_row: 3
        data_rows_at_survey: 607
        key: "発生日 + 内容"
        note: |
          2026-08-14: 発生日 列を D に新設し、UPSIDER カード明細 607 行（2026-03-31〜2026-08-13、
          MoneyForward 会計のカード連携から取得）を投入した。
          取得元は 614 件だが、同日・同額・同カード・同加盟店の重複 6 組を各1件に集約して 607 行。
          集約した行は備考に「同日同額N件を1件に集約」と記載。
          粒度は「1行1明細」。支払先ID+発生月 での月次集約はしない（明細で持つことが要件）。
          このタブは仕訳ではなく明細の蓄積・可視化。カード払いの仕訳は会計側のカード連携が担当するため、
          ここから仕訳を起こすと二重計上になる。備考の `出所=UPSIDER(MF連携)` がその目印。
          支払先ID は空。カード加盟店（190社）は支払先マスタ未登録で、採番するとマスタが荒れるため
          意図的に空にしている。埋める場合は加盟店IDの採番ルールを先に決めること。
        columns:
          - name: "支払先ID"
            note: "UPSIDER 明細行では空。支払先マスタは振込先用で、カード加盟店は登録していない。"
          - name: "費目"
          - name: "発生月"
            note: "YYYY-MM の文字列。日付型にしない。"
          - name: "発生日"
            note: "YYYY-MM-DD の文字列。日付型にしない。2026-08-14 追加。"
          - name: "内容"
          - name: "金額（税抜）"
          - name: "消費税額"
          - name: "金額（税込）"
          - name: "備考"
          - name: "作成者"
          - name: "作成日時"
          - name: "更新者"
          - name: "更新日時"

      源泉徴収管理:
        header_row: 3
        data_rows_at_survey: 0
        key: "支払先ID + 対象月"
        note: "実データ0行。源泉対象の支払の税額と納付状況を管理する枠。"
        columns:
          - name: "支払先ID"
          - name: "支払先名"
          - name: "支払先区分"
          - name: "対象月"
          - name: "支払金額（税抜）"
          - name: "源泉徴収税率"
          - name: "源泉徴収税額"
          - name: "差引支払額"
          - name: "納付期限"
          - name: "納付日"
          - name: "納付ステータス"
          - name: "備考"

      月次支払スケジュール:
        header_row: 1
        data_rows_at_survey: 0
        key: "予定ID"
        note: "契約から展開した支払の予定。実データはまだ0行。"
        columns:
          - name: "予定ID"
          - name: "契約ID"
          - name: "取引先ID"
          - name: "支払先ID"
          - name: "支払先名"
          - name: "対象月"
          - name: "予定額(税込)"
          - name: "支払予定日"
          - name: "状態"
            values: ["未払予定", "請求書受領済", "支払済"]
            order: "未払予定 → 請求書受領済 → 支払済"
          - name: "受領請求書ID"
          - name: "突合結果"
            values: ["一致", "未計上"]
          - name: "突合日時"
          - name: "作成者"
          - name: "作成日時"
          - name: "更新者"
          - name: "更新日時"

  仕訳台帳:
    tabs:
      仕訳帳:
        header_row: 1
        data_rows_at_survey: 15
        key: "仕訳ID"
        note: >
          内部仕訳帳。同じ 参照ID×出所×対象月 は再生成しない（対象月をキーに含めるのが肝。
          合算請求は対象月をまたぐため、2キーだと正常な月別計上を重複と誤検知する）。
          記帳の前後で assets/scripts/verify_ledger.py を走らせ、ERROR があれば記帳しない。
          金額は税込で持つ（仮受／仮払消費税を別行で分けない）。会計SaaSのレポートは税抜で返ることが
          あるため、突合時は必ず税基準を揃える（MFは include_tax: true）。
          仕訳IDは台帳全体で一意。J-YYYYMM-連番4桁 を出所グループごとに採番すると衝突する。
          参照IDに枝番（INV-xxx/C-029 等）を付けない。付けると重複防止をすり抜ける。
        columns:
          - name: "仕訳ID"
          - name: "日付"
            observed: ["2026-07-22", "2026-07-31"]  # 実データの分布（規定値ではない）
          - name: "借方科目"
            observed: ["売掛金", "普通預金"]  # 実データの分布（規定値ではない）
          - name: "借方金額"
            observed: ["110000", "1375000", "165000", "220000", "2200000"]  # 実データの分布（規定値ではない）
          - name: "貸方科目"
            observed: ["売上高", "売掛金"]  # 実データの分布（規定値ではない）
          - name: "貸方金額"
            observed: ["110000", "1375000", "165000", "220000", "2200000"]  # 実データの分布（規定値ではない）
          - name: "税区分"
            observed: ["対象外", "課税売上10%"]  # 実データの分布（規定値ではない）
